<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; width: 240px; padding: 16px;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f0f10; color: #eee;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  header img { width: 28px; height: 28px; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .status { font-weight: 600; }
  .status.off { color: #888; }
  .status.on { color: #ff4d5e; }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer; border-radius: 24px;
    background: #3a3a3d; transition: background .2s;
  }
  .slider::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    border-radius: 50%; background: #fff; transition: transform .2s;
  }
  input:checked + .slider { background: #dc1428; }
  input:checked + .slider::before { transform: translateX(20px); }
  .stats {
    margin-top: 16px; padding: 12px; border-radius: 10px; background: #1b1b1d;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .stats b { font-size: 20px; color: #fff; }
  .muted { color: #999; font-size: 12px; }
  button.reset {
    margin-top: 10px; background: none; border: none; color: #777; font-size: 11px;
    cursor: pointer; padding: 0;
  }
  button.reset:hover { color: #bbb; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>YouTube Keep Watching</h1>
  </header>

  <div class="row">
    <span id="status" class="status on">On</span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats">
    <span class="muted">Pauses blocked</span>
    <b id="saves">0</b>
  </div>
  <button class="reset" id="reset">Reset counter</button>

  <script src="popup.js"></script>
</body>
</html>
